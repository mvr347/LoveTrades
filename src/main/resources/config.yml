settings:
  # Время ожидания запроса на торговлю (в секундах)
  request-timeout: 30
  # Длительность финального отсчёта (в секундах)
  countdown-duration: 3
  # Время бездействия в активной торговле, после которого она отменяется (в секундах).
  # 0 или меньше — отключает проверку бездействия.
  inactivity-timeout-seconds: 120
  # 2026-11-10: опыт в сделке меняется кликами по кнопке: ЛКМ -1 уровень, ПКМ +1 уровень, Shift с тем же кликом меняет сразу
  # на этот шаг. Ввод числа в чат убран: он вылетал из окна сделки и позволял передумать незаметно для партнёра. 5 уровней
  # это быстрый, но заметный шаг: от 0 до 30 за шесть кликов, а не за тридцать.
  xp-shift-step: 5

# Ограничения торговли.
restrictions:
  # Запрещать начинать торговлю игрокам в PvP.
  # Проверка идёт при отправке запроса и при его принятии.
  block-in-combat: true
  # Ключи Bukkit Metadata, которыми combat/antirelog-плагины помечают игрока в бою.
  # DeluxeCombat и большинство подобных плагинов используют "in_combat";
  # если ваш плагин ставит другой ключ — допишите его сюда.
  combat-metadata-keys:
    - "in_combat"
  # Кулдаун между торговлями одной и той же пары игроков (в секундах).
  # Отсчитывается от завершения торговли. 0 или меньше — отключает кулдаун.
  pair-cooldown-seconds: 180
  # Максимум стаков предметов, которые одна сторона может выставить за торговлю.
  # Одинаковые предметы из разных слотов складываются: два полустака железа — один стак.
  # Нестакающиеся предметы (оружие, броня, инструменты) считаются по стаку за штуку.
  # 0 или меньше — отключает лимит.
  max-stacks-per-side: 5
  # 2026-11-10: максимум уровней опыта, который одна сторона может предложить. Отдать больше, чем есть, нельзя и без лимита
  # (кнопка упирается в текущий уровень игрока). 0 или меньше - ограничивает только уровень игрока.
  max-xp-levels-per-side: 0
  # 2026-11-12: число слотов для предметов у каждой стороны зависит от ступени вежливости (LoveBehavior): чем выше
  # вежливость, тем больше доверия и слотов. Семь ступеней шкалы 0..6: Изгой, Плохой, Ниже среднего, Нейтральный (4),
  # Хорошо, Отлично, Идеально. Остальные слоты закрыты стеклом, а не спрятаны, чтобы игрок видел, за что растёт доступ.
  # Максимум - 16 (размер зоны). Без LoveBehavior игрок считается нейтральным (4 слота). Лимит max-stacks-per-side
  # действует поверх этого: стаков не может быть больше, чем открытых слотов.
  trade-slots-by-politeness: [1, 2, 3, 4, 6, 8, 9]

# Интеграция с клановым плагином.
# enabled: включить проверку клановых отношений при торговле.
# ally-bonus: модификатор налога для союзников (отрицательное = бонус к ресурсам обоим игрокам).
#   Пример: -10.0 означает, что оба игрока получают на 10% больше предметов/XP при торговле.
# enemy-block: запрещать торговлю между игроками из враждебных кланов.
clan:
  enabled: true
  ally-bonus: -10.0
  enemy-block: true

# Модификаторы налогов по группам прав.
# Игроку нужен перм lovetrades.modifier.<name> для применения группы.
# tax: положительное — налог (получатель получает меньше)
#      отрицательное — бонус (получатель получает больше; применяется к предметам и XP)
# Индивидуальные модификаторы игроков хранятся в data/players.yml и суммируются с групповым.
modifiers:
  groups:
    vip:
      permission: "lovetrades.modifier.vip"
      tax: -10.0
    donor:
      permission: "lovetrades.modifier.donor"
      tax: 15.0
    newcomer:
      permission: "lovetrades.modifier.newcomer"
      tax: 25.0

