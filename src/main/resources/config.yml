settings:
  # Время ожидания запроса на торговлю (в секундах)
  request-timeout: 30
  # Длительность финального отсчёта (в секундах)
  countdown-duration: 3

# Модификаторы налогов по группам прав.
# Игроку нужен перм axtrades.modifier.<name> для применения группы.
# tax: положительное — налог (получатель получает меньше)
#      отрицательное — бонус (получатель получает больше XP; для предметов минимум 0)
# Индивидуальные модификаторы игроков хранятся в data/players.yml и суммируются с групповым.
modifiers:
  groups:
    vip:
      permission: "axtrades.modifier.vip"
      tax: -10.0
    donor:
      permission: "axtrades.modifier.donor"
      tax: 15.0
    newcomer:
      permission: "axtrades.modifier.newcomer"
      tax: 25.0

