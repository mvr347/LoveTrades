# 2026-10-30: пасхалка «Бессмысленно, но честно». Если оба игрока отдали ровно одно и то же (те же предметы в том же
# общем количестве, как бы они ни лежали по ячейкам) и уровни опыта не передавались, обоим приходит реплика, а
# тайна записывается в «Книгу тайн» LoveEssential. Ни на налог, ни на сделку это не влияет.
easter-eggs:
  same-for-same: true

# 2026-11-10: меню сделки показывает кнопки головами (специальное меню по gui_gen: раскладка своя, рамка из стекла остаётся
# только у разделителей и таймера). Значение - base64 текстуры (value из textures.minecraft.net). Не указанный ключ берёт
# текстуру по умолчанию из плагина, поэтому после обновления на существующем сервере всё работает без правки этого файла.
# Ключи: ready, not-ready, cancel, xp, info (ваше предложение), info-partner (предложение партнёра). Пример: heads: {xp: "eyJ0ZXh0dXJlcyI6..."}
heads: {}
